<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kiểm Tồn & Hạn Sử Dụng · WinMart+ Rural</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#d71920; --navy:#1a3c6e; --gold:#ffc107; --green:#1e8e4e;
  --bg:#f4f6fb; --card:#ffffff; --line:#e5e9f2; --txt:#1c2434; --mut:#6b7280;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Be Vietnam Pro',system-ui,sans-serif;
  background:var(--bg);color:var(--txt);min-height:100vh;padding:16px;
  -webkit-font-smoothing:antialiased;padding-bottom:80px;
}
.wrap{max-width:560px;margin:0 auto}

/* Header */
.head{
  background:linear-gradient(135deg,var(--navy),#2c4a8a);
  color:#fff;border-radius:16px;padding:18px 20px 20px;
  box-shadow:0 8px 24px rgba(26,60,110,.18);margin-bottom:14px;
}
.head h1{font-size:16px;font-weight:800;line-height:1.3}
.head p{font-size:11px;opacity:.85;margin-top:4px}
.head .head-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.head .vbadge{display:inline-block;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600;margin-top:8px}
.head .dash-link{color:#fff;text-decoration:none;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.16);padding:8px 14px;border-radius:10px;white-space:nowrap}

/* Card */
.card{
  background:var(--card);border-radius:14px;padding:14px;margin-top:14px;
  box-shadow:0 2px 10px rgba(20,30,60,.06);border:1px solid var(--line);
}
.card h2{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card h2 .dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex-shrink:0;margin-top:1px}

/* Form elements */
label{font-size:11.5px;font-weight:600;color:var(--mut);display:block;margin:10px 0 5px}
label:first-child{margin-top:0}
input,select,textarea{
  width:100%;font-size:14px;font-family:inherit;padding:10px 11px;
  border:1.5px solid var(--line);border-radius:10px;background:#fafbfd;color:var(--txt);
  outline:none;transition:border .15s;
}
input:focus,select:focus{border-color:var(--navy);background:#fff}

/* Pill / tag */
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;background:#fef3c7;color:#92400e}
.pill.blue{background:#eef2ff;color:var(--navy)}

/* Warnings — compact inline */
.warn{
  font-size:11px;color:#b45309;font-weight:500;
  display:inline-flex;align-items:center;gap:3px
}
.warn-block{
  background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;
  padding:6px 9px;font-size:11px;color:#92400e;margin:4px 0;font-weight:500;
}
.err{
  background:#fee2e2;border:1px solid #fca5a5;border-radius:10px;
  padding:9px 12px;font-size:12px;color:#991b1b;margin:6px 0;font-weight:600;
}
.okMsg{color:var(--green);font-size:12px;margin:6px 0;font-weight:600}

/* Product row — compact */
.prod{border-top:1px solid var(--line);padding:6px 0;margin:0}
.prod:first-child{border-top:none}
.prod-head{display:flex;align-items:flex-start;gap:4px;flex-wrap:wrap;cursor:default}
.prod-head .pcode{font-size:10.5px;font-weight:700;color:var(--mut);white-space:nowrap}
.prod-head .pname{font-size:12px;font-weight:700;color:var(--txt);flex:1;min-width:0;line-height:1.3}
.prod-head .pills{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap}
.prod-head .pill{font-size:10px;padding:2px 7px}
/* Inline lot row */
.lot{display:flex;align-items:center;gap:6px;margin:3px 0 0;flex-wrap:wrap}
.lot input.sl{width:68px;font-size:13px;padding:5px 7px;text-align:center}
.lot input.hsd{width:110px;font-size:13px;padding:5px 7px;text-align:center}
.lot .btn-addlot{font-size:16px;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--navy);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;line-height:1}
.lot .lotwarn{font-size:10.5px;width:100%;color:#b45309}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:13px 16px;border-radius:12px;border:none;font-size:13.5px;font-weight:700;
  cursor:pointer;transition:opacity .15s,transform .05s;font-family:inherit
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 6px 18px rgba(215,25,32,.3)}
.btn-blue{background:var(--navy);color:#fff;box-shadow:0 4px 14px rgba(26,60,110,.25)}
.btn-ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn-block{width:100%;margin-top:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Fixed bottom bar */
.submit-bar{
  position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
  padding:10px 14px;display:flex;gap:10px;z-index:100;max-width:560px;margin:0 auto;
  box-shadow:0 -2px 10px rgba(0,0,0,.05)
}
.submit-bar .btn{flex:1;padding:12px;font-size:14px}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(80px);
  background:#166534;color:#fff;padding:12px 22px;border-radius:12px;font-weight:600;
  font-size:13px;transition:.3s;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:200;
  white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:#991b1b}

/* Distance */
.dist-box{display:none;margin-top:10px;padding:10px 12px;border-radius:9px;font-size:13px;font-weight:600}
.dist-box.ok{display:block;background:#ecfdf5;color:#065f46}
.dist-box.bad{display:block;background:#fee2e2;color:#991b1b}
.dist-box.info{display:block;background:#fef3c7;color:#92400e}

/* Recap card */
.recap{font-size:13px;line-height:1.6}
.recap b{color:var(--navy)}

/* Unsurveyed */
#unsurveyed .by-q{font-size:12px;margin:4px 0;color:var(--txt);line-height:1.6}
#unsurveyed .by-q .pq{font-weight:700;color:var(--navy)}

/* Footer */
.foot{text-align:center;color:var(--mut);font-size:11.5px;margin-top:20px;margin-bottom:60px}
.foot a{color:var(--navy);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">

  <!-- Header -->
  <div class="head">
    <div class="head-row">
      <div>
        <h1>🔍 Kiểm Tồn &amp; Hạn Sử Dụng</h1>
        <p id="sub">WinMart+ Rural · Đang tải...</p>
      </div>
      
    </div>
    <div class="vbadge" id="vb">v1.0</div>
  </div>

  <!-- Chọn CH -->
  <div class="card">
    <h2><span class="dot"></span>1. Chọn cửa hàng</h2>
    <label>Đợt rà soát</label>
    <select id="selDot"></select>
    <label>Cửa hàng</label>
    <select id="selCh"></select>
    
  </div>

  <!-- Kiểm tồn thực tế -->
  <div class="card" id="cardProd" style="display:none">
    <h2><span class="dot"></span>2. Kiểm tồn thực tế</h2>
    <div id="prodList"></div>
  </div>

  <!-- Nhắc đồng đội -->
  <div class="card" id="unsurveyed" style="display:none">
    <h2 style="color:var(--gold)">🤝 Cùng nhắc đồng đội làm kiểm tồn bạn nhé!</h2>
    <div id="unsContent"></div>
  </div>

  <!-- Footer -->
  <div class="foot">
    Form kiểm tồn · <a href="dashboard.html">Dashboard ↗</a> · WinMart+ Rural
  </div>
</div>

<!-- Submit bar -->
<div class="submit-bar">
  <button class="btn btn-primary" id="btnSubmit" disabled>💾 Gửi khai báo</button>
</div>

<div class="toast" id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxM-yFzIPsW-HG3RY5VRICeE04XVLMxZ8RBFYUs_lQqTF2NkDqUrzPmRGOjVIe6UIrbOQ/exec';

let DOTS = [], DULIEU = [], CAIDAT = {};
let chInfo = null;
let curDotId = '';
let myKhaiBao = [];
let doneChSet = new Set();

const $ = id => document.getElementById(id);

function fmt(n) { return (n==null||isNaN(n))?'':Number(n); }
function esc(s) { return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function parseHSD(s) {
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(s).trim());
  if (!m) return null;
  return new Date(+m[3], +m[2]-1, +m[1]);
}
function daysFromToday(d) {
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}

async function load() {
  try {
    const r = await fetch(GAS_URL + '?action=formdata', {cache:'no-store'});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error||'Lỗi tải');
    DULIEU = j.dulieu||[];
    CAIDAT = j.caidat||{};
    curDotId = j.activeDot||'';
    myKhaiBao = j.myKhaiBao||[];
    buildDoneSet(j.khaibao||[]);
    DOTS = await loadDots();
    render();
  } catch(e) {
    $('sub').textContent = 'Không tải được dữ liệu · ' + String(e);
  }
}

async function loadDots() {
  try {
    const r = await fetch(GAS_URL + '?action=data', {cache:'no-store'});
    const j = await r.json();
    return j.dots||[];
  } catch(e) { return []; }
}

function render() {
  $('sub').textContent = 'Đợt: ' + (curDotId||'chưa có') + ' · ' + DULIEU.length + ' dòng DL';
  $('vb').textContent = 'v1.0 · ' + String(DOTS.length||0) + ' đợt';
  const sel = $('selDot');
  sel.innerHTML = '';
  DOTS.forEach(d => {
    const o = document.createElement('option');
    o.value = String(d.ID);
    o.textContent = d.TenDot||d.ID;
    if (String(d.ID)===curDotId) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = () => { curDotId = sel.value; fillCH(sel.value); };
  fillCH(curDotId);
}

function fillCH(dotId) {
  const list = DULIEU.filter(r => String(r.DotID)===dotId);
  const map = {};
  list.forEach(r => { map[String(r.MaCH)] = r; });
  const sel = $('selCh');
  sel.innerHTML = '';
  if (!Object.keys(map).length) {
    sel.innerHTML = '<option value="">— chưa có dữ liệu đợt này —</option>';
    chInfo = null; $('cardProd').style.display = 'none'; return;
  }
  Object.values(map).forEach(c => {
    const o = document.createElement('option');
    o.value = String(c.MaCH);
    o.textContent = (c.MaCH||'') + ' — ' + (c.TenCH||'');
    sel.appendChild(o);
  });
  sel.onchange = () => onSelectCH(sel.value);
  onSelectCH(sel.value);
}

function onSelectCH(ma) {
  chInfo = DULIEU.find(r => String(r.MaCH)===String(ma))||null;
  renderProducts();
}

function renderProducts() {
  const box = $('prodList');
  box.innerHTML = '';
  if (!chInfo) { $('cardProd').style.display = 'none'; return; }
  const ma = String(chInfo.MaCH);
  const prods = DULIEU.filter(r => String(r.MaCH)===ma && String(r.DotID)===curDotId);
  $('cardProd').style.display = 'block';
  if (!prods.length) { box.innerHTML = '<div class="warn-block">Đợt này chưa có hàng cần kiểm.</div>'; return; }

  prods.forEach(p => {
    const d = document.createElement('div');
    d.className = 'prod';
    d.id = 'prod_' + p.MaHang;
    d.innerHTML = `
      <div class="prod-head">
        <span class="pcode">${esc(p.MaHang||'')}</span>
        <span class="pname">${esc(p.TenHang||'')}</span>
        <span class="pills">
          <span class="pill blue">${esc(p.DVT||'-')}</span>
          <span class="pill">DK:${esc(p.SL_DuKien||'0')}</span>
          <span class="pill" style="background:#e8f5e9;color:#2e7d32;display:none" class="sum-pill">∑0</span>
        </span>
      </div>
      <div class="lot-lists"></div>
    `;
    box.appendChild(d);
    addLot(p.MaHang);
  });
}

function addLot(maHang) {
  const listBox = document.querySelector('#prod_' + maHang + ' .lot-lists');
  const lot = document.createElement('div');
  lot.className = 'lot';
  lot.innerHTML = `
    <input type="number" class="sl" inputmode="numeric" placeholder="SL">
    <input type="text" class="hsd" placeholder="dd/mm/yyyy">
    <button class="btn-addlot" type="button" title="Thêm lô">＋</button>
    <span class="lotwarn"></span>
  `;
  listBox.appendChild(lot);
  lot.querySelector('.sl').addEventListener('input', () => checkProd(maHang));
  lot.querySelector('.hsd').addEventListener('input', () => checkProd(maHang));
  lot.querySelector('.btn-addlot').addEventListener('click', () => addLot(maHang));
  checkProd(maHang);
}

function checkProd(maHang) {
  const prod = DULIEU.find(r => String(r.MaHang)===String(maHang) && String(r.MaCH)===String(chInfo.MaCH));
  if (!prod) return;
  const box = document.querySelector('#prod_' + maHang);
  if (!box) return;
  const lots = box.querySelectorAll('.lot');
  let totalSL = 0;
  lots.forEach(lot => {
    const sl = fmt(lot.querySelector('.sl').value)||0;
    const hsd = lot.querySelector('.hsd').value.trim();
    const wBox = lot.querySelector('.lotwarn');
    totalSL += sl;
    const w = checkLot(sl, hsd);
    wBox.innerHTML = w.map(x => '⚠' + x).join(' · ');
  });
  // Update sum pill
  const sumPill = box.querySelector('.sum-pill');
  if (sumPill) {
    if (totalSL > 0) { sumPill.style.display = 'inline-block'; sumPill.textContent = '∑' + totalSL; }
    else sumPill.style.display = 'none';
  }
  const dukien = fmt(prod.SL_DuKien)||0;
  if (dukien>0 && totalSL>0) {
    const lech = Math.abs(totalSL-dukien)/dukien*100;
    const ng = fmt(CAIDAT.sl_lech_pct)||20;
    const exWarn = box.querySelector('.prod-warn');
    if (lech>ng) {
      if (!exWarn) {
        const wd = document.createElement('div');
        wd.className = 'warn-block prod-warn';
        wd.textContent = '⚠ Tổng SL lệch ' + lech.toFixed(0) + '% so với tồn dự kiến (' + dukien + ')';
        box.appendChild(wd);
      }
    } else {
      if (exWarn) exWarn.remove();
    }
  }
  checkSubmitable();
}

function checkLot(sl, hsd) {
  const w = [];
  if (hsd) {
    const d = parseHSD(hsd);
    if (!d) { w.push('Hạn sử dụng sai định dạng (dd/mm/yyyy)'); }
    else {
      const days = daysFromToday(d);
      const canhan = fmt(CAIDAT.canhan_ngay)||30;
      const hethanLau = fmt(CAIDAT.hethan_lau_ngay)||60;
      const quaXa = fmt(CAIDAT.han_qua_xa_ngay)||365;
      if (days<0) {
        if (-days>hethanLau) w.push('Đã hết hạn quá ' + hethanLau + ' ngày');
        else w.push('Đã hết hạn ' + (-days) + ' ngày');
      } else if (days<=canhan) {
        w.push('Cận hạn — còn ' + days + ' ngày');
      } else if (days>quaXa) {
        w.push('Hạn còn lại quá xa (' + days + ' ngày)');
      }
    }
  }
  return w;
}

function checkSubmitable() {
  if (!chInfo) { $('btnSubmit').disabled=true; return; }
  const prods = document.querySelectorAll('.prod');
  let hasData = false;
  prods.forEach(p => { p.querySelectorAll('.lot').forEach(l=>{ if(l.querySelector('.sl').value) hasData=true; }); });
  $('btnSubmit').disabled = !hasData;
}

async function submit() {
  if (!chInfo) return;
  const lots = [];
  document.querySelectorAll('.prod').forEach(p => {
    const maHang = p.id.replace('prod_','');
    p.querySelectorAll('.lot').forEach(lot => {
      const sl = fmt(lot.querySelector('.sl').value)||0;
      const hsd = lot.querySelector('.hsd').value.trim();
      if (sl>0) {
        const w = checkLot(sl,hsd);
        lots.push({ MaCH:chInfo.MaCH,MaHang,SL_Lo:sl,HSD:hsd, CanhBao:w.join('; ') });
      }
    });
  });
  if (!lots.length) { showToast('Vui lòng nhập ít nhất 1 lô', true); return; }
  $('btnSubmit').disabled = true;
  try {
    const r = await fetch(GAS_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'submit',dot:curDotId,lots})
    });
    const j = await r.json();
    if (j.ok) {
      doneChSet.add(String(chInfo.MaCH));
      renderUnsurveyed();
      showToast('✅ Đã gửi ' + j.n + ' dòng khai báo');
      resetForm();
    } else {
      showToast('❌ '+(j.error||'Lỗi gửi'), true);
      $('btnSubmit').disabled = false;
    }
  } catch(e) {
    showToast('❌ '+String(e), true);
    $('btnSubmit').disabled = false;
  }
}

function resetForm() {
  document.querySelectorAll('.lot').forEach(l=>l.remove());
  document.querySelectorAll('.prod').forEach(p=>addLot(p.id.replace('prod_','')));
  checkSubmitable();
}

// ---- Nhắc đồng đội ----
function buildDoneSet(khaibao) {
  doneChSet = new Set();
  for (const kb of khaibao) { if (kb.MaCH) doneChSet.add(String(kb.MaCH)); }
  renderUnsurveyed();
}

function getUnsurveyed() {
  if (!curDotId) return [];
  const seen = new Set();
  const out = [];
  for (const r of DULIEU) {
    if (String(r.DotID)!==curDotId) continue;
    const m = String(r.MaCH);
    if (seen.has(m)) continue;
    seen.add(m);
    if (!doneChSet.has(m)) out.push(r);
  }
  return out;
}

function renderUnsurveyed() {
  const box = $('unsurveyed');
  const content = $('unsContent');
  if (!box||!content) return;
  const list = getUnsurveyed();
  if (!list.length) { box.style.display='none'; return; }
  box.style.display='block';
  const byQLKV = {};
  list.forEach(r => { const q = r.QLKV||'Chưa phân KV'; if (!byQLKV[q]) byQLKV[q]=[]; byQLKV[q].push(r); });
  let html = '<div style="font-size:13px;color:var(--mut);margin-bottom:8px">Còn <b>' + list.length + '</b> CH chưa làm kiểm tồn:</div>';
  for (const [q, chs] of Object.entries(byQLKV)) {
    html += '<div class="by-q"><span class="pq">' + q + ' (' + chs.length + '):</span> ';
    html += chs.map(c => esc(c.MaCH||'') + (c.TenCH?' - '+esc(c.TenCH):'')).join(' · ') + '</div>';
  }
  content.innerHTML = html;
}

function showToast(msg, isErr) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr?' err':'');
  setTimeout(() => t.className='toast', 3000);
}

$('btnSubmit').addEventListener('click', submit);
load();
</script>
</body>
</html>
